      (function() {

            var insets = JSON.parse(window.AndroidBridge.getSafeAreaInsets());
            if (insets.top > 0) top = Math.max(insets.top, 38);

          document.documentElement.style.setProperty('--sab', bottom + 'px');

          var rawTheme = localStorage.getItem('squircle_theme_state_v1');
          var theme = 'warm-morning';
          var isDark = false;
          if (rawTheme) {
            try {
              var parsed = JSON.parse(rawTheme);
              if (parsed && parsed.theme) {
                theme = parsed.theme;
                isDark = theme === 'warm-evening' || theme === 'cool-evening';
              }
            } catch(e) {}
          } else {
            var hour = new Date().getHours();
            if (hour >= 18 || hour < 6) {
              theme = 'warm-evening';
              isDark = true;
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
